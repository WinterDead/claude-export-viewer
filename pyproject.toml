[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-export-viewer"
version = "1.2.0"
description = "Local web app for reading Claude.ai data exports"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-WTF>=1.2,<2",
    "markdown>=3.5,<4",
    "bleach>=6.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["viewer*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
